<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 辣椒身体 -->
  <defs>
    <linearGradient id="pepperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D63900;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 辣椒主体 -->
  <ellipse cx="16" cy="18" rx="9" ry="11" fill="url(#pepperGradient)" filter="url(#shadow)"/>
  
  <!-- 辣椒尖端 -->
  <path d="M 16 29 Q 14 26 14 23 Q 14 20 16 19 Q 18 20 18 23 Q 18 26 16 29" fill="url(#pepperGradient)"/>
  
  <!-- 辣椒茎/叶 -->
  <ellipse cx="16" cy="5" rx="2.5" ry="4" fill="#2D5016"/>
  <path d="M 14 8 Q 12 7 11 9" stroke="#2D5016" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 18 8 Q 20 7 21 9" stroke="#2D5016" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- 高光（辣椒的光泽感） -->
  <ellipse cx="12" cy="13" rx="3" ry="4" fill="white" opacity="0.4"/>
  
  <!-- 眼睛（可爱感） -->
  <circle cx="13" cy="16" r="1" fill="#8B4513" opacity="0.6"/>
  <circle cx="19" cy="16" r="1" fill="#8B4513" opacity="0.6"/>
  
  <!-- 微笑嘴角 -->
  <path d="M 15 19 Q 16 20 17 19" stroke="#8B4513" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
