<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Cute red chili pepper">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5B3A"/>
      <stop offset="0.55" stop-color="#FF3A2A"/>
      <stop offset="1" stop-color="#C92B1A"/>
    </linearGradient>

    <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6281A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#9F2216"/>
    </linearGradient>

    <radialGradient id="highlightGrad" cx="0.3" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BB03A"/>
      <stop offset="1" stop-color="#2E5B18"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- scale original 512x512 artwork down to 32x32 via group transform -->
  <g transform="scale(0.0625)" filter="url(#softShadow)">
    <!-- main pepper body -->
    <path d="M116 352
             C80 320, 80 240, 140 188
             C200 136, 240 120, 296 120
             C364 120, 420 164, 430 232
             C438 292, 412 344, 358 380
             C314 408, 230 434, 170 398
             C150 388,128 372,116 352 Z"
          fill="url(#bodyGrad)"/>

    <!-- darker right-side shading -->
    <path d="M326 132
             C378 140, 404 176, 412 232
             C418 280, 396 316, 360 346
             C340 362, 300 382, 270 392
             C296 344, 320 260, 326 132 Z"
          fill="url(#sideGrad)" opacity="0.9"/>

    <!-- underside darker rim for depth -->
    <path d="M150 372
             C190 392, 260 410, 328 400
             C350 396, 374 384, 388 374
             C374 384, 330 408, 270 430
             C200 448, 140 420, 150 372 Z"
          fill="#A22618" opacity="0.85"/>

    <!-- glossy highlight -->
    <path d="M160 220
             C180 200, 200 184, 240 180
             C255 178, 268 182, 280 192
             C240 188, 205 206, 180 234
             C170 246, 162 238, 160 220 Z"
          fill="url(#highlightGrad)" opacity="0.9"/>

    <!-- small bright curve highlight -->
    <path d="M180 260
             C210 248, 240 242, 270 246"
          fill="none" stroke="#FFD7CF" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

    <!-- stem / leaves -->
    <g transform="translate(300,86) rotate(-18)">
      <path d="M0 0 C24 -6, 48 -12, 72 -10 C62 6, 46 20, 28 28 C10 36, -8 34, 0 0 Z"
            fill="url(#stemGrad)"/>
      <path d="M52 -6 C74 -18, 104 -12, 120 10 C96 -2, 74 8, 52 -6 Z"
            fill="url(#stemGrad)"/>
      <!-- small inner shading on leaves -->
      <path d="M14 24 C24 18, 38 12, 58 10" fill="none" stroke="#2A4D11" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- cute eyes -->
    <g transform="translate(0,0)">
      <circle cx="212" cy="258" r="28" fill="#000000"/>
      <circle cx="300" cy="258" r="28" fill="#000000"/>
      <!-- white highlights -->
      <circle cx="200" cy="246" r="8" fill="#ffffff" opacity="0.95"/>
      <circle cx="288" cy="246" r="8" fill="#ffffff" opacity="0.95"/>
    </g>

    <!-- smiling mouth -->
    <path d="M230 308 Q256 332 290 308" stroke="#1B0E06" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

  </g>

</svg>
