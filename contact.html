<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 小辣椒 CHILI</title>
    <link rel="icon" href="https://raw.githubusercontent.com/ayudekaka/lifengyu/main/chili-32x32.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ========== 基础重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #faf8f7;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== 头部导航 ===== */
        .site-header {
            background: #ffffff;
            border-bottom: 1px solid #f0ede8;
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .site-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #1a1a1a;
        }

        .brand img {
            width: 40px;
            height: 40px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .brand-name strong {
            color: #b71c1c;
            font-weight: 700;
        }

        .main-nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .main-nav a {
            text-decoration: none;
            color: #444;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s ease;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }

        .main-nav a:hover {
            color: #b71c1c;
            border-bottom-color: #b71c1c;
        }

        .main-nav a.active {
            color: #b71c1c;
            border-bottom-color: #b71c1c;
        }

        /* ===== Hero ===== */
        .hero {
            background: #ffffff;
            padding: 50px 0 30px;
            text-align: center;
            border-bottom: 1px solid #f0ede8;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .hero h1 .accent {
            color: #b71c1c;
        }

        .hero .lead {
            font-size: 18px;
            color: #444;
            font-weight: 400;
            margin-top: 10px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
        }

        /* ================================================================ */
        /* ===== 卡片样式（与首页一致，无浮动动画） ===== */
        /* ================================================================ */

        .float-card {
            animation: none !important;
            background: #ffffff !important;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            padding: 28px 22px 24px;
            border: 1px solid #f0ede8;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.3s ease,
                        transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: opacity, transform;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 滚动入场 */
        .float-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 悬停上浮 + 阴影 */
        .float-card:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06) !important;
        }

        /* 图标 */
        .float-card .icon {
            display: block;
            margin: 0 auto 12px auto;
            width: 48px;
            height: 48px;
            transition: transform 0.4s ease;
        }
        .float-card:hover .icon {
            transform: scale(1.10);
        }

        .float-card .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 标题 */
        .float-card h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
            letter-spacing: 1px;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }
        .float-card:hover h3 {
            color: #b71c1c;
            text-shadow: 0 0 32px rgba(211, 47, 47, 0.35), 0 4px 24px rgba(211, 47, 47, 0.15);
        }

        /* 链接地址 */
        .float-card .value {
            font-size: 15px;
            color: #444;
            word-break: break-all;
            transition: color 0.4s ease, transform 0.4s ease;
        }
        .float-card:hover .value {
            color: #111;
            transform: scale(1.02);
        }

        .float-card .value a {
            color: #b71c1c;
            text-decoration: none;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .float-card:hover .value a {
            color: #b71c1c;
            transform: scale(1.02);
        }
        .float-card .value a:hover {
            text-decoration: underline;
        }

        /* ===== 两列网格布局（与首页一致） ===== */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding-top: 28px;
            padding-bottom: 20px;
        }

        /* ===== 页脚样式 ===== */
        .site-footer {
            width: 100%;
            background: #ffffff;
            border-top: 1px solid #f0ede8;
            padding: 25px 15px;
            text-align: center;
        }

        .site-footer h4 {
            font-weight: 600;
            color: #b71c1c;
            margin-bottom: 4px;
        }

        .site-footer p {
            color: #999;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .site-header .container {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .brand {
                justify-content: center;
            }
            .main-nav {
                justify-content: center;
                gap: 14px;
            }
            .main-nav a {
                font-size: 14px;
            }
            .hero h1 {
                font-size: 28px;
            }
            .hero .lead {
                font-size: 16px;
                padding: 0 10px;
            }
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 16px;
                padding-top: 20px;
            }
            .float-card {
                padding: 24px 18px 20px;
            }
            .site-footer {
                padding: 25px 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 14px;
            }
            .hero {
                padding: 30px 0 20px;
            }
            .hero h1 {
                font-size: 24px;
            }
            .hero .lead {
                font-size: 15px;
                padding: 0 6px;
            }
            .float-card {
                padding: 20px 14px 16px;
            }
            .float-card .value {
                font-size: 14px;
            }
            .site-footer {
                padding: 25px 15px;
            }
        }
    </style>
</head>

    <!-- ===== 滚动入场 Script ===== -->
    <script>
        (function() {
            const cards = document.querySelectorAll('.float-card');
            if (cards.length && 'IntersectionObserver' in window) {
                const observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.15, rootMargin: '0px 0px -20px 0px' });

                cards.forEach(function(card, index) {
                    setTimeout(function() {
                        observer.observe(card);
                    }, index * 80);
                });

                requestAnimationFrame(function() {
                    cards.forEach(function(card) {
                        const rect = card.getBoundingClientRect();
                        const winHeight = window.innerHeight || document.documentElement.clientHeight;
                        if (rect.top < winHeight - 50) {
                            card.classList.add('visible');
                            observer.unobserve(card);
                        }
                    });
                });
            } else {
                cards.forEach(function(card) {
                    card.classList.add('visible');
                });
            }
        })();
    </script>
